<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDRA - 3D Asset Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Librairie jsPDF pour l'export vectoriel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #ffcc00;
            --primary-hover: #e6b800;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            padding: 1.5rem 2rem;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: var(--primary);
            text-transform: uppercase;
        }

        .doc-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-left: 2.8rem; /* Align with text */
        }

        .doc-date {
            color: white;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        input, select, .btn-action {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        input:focus, select:focus { border-color: var(--primary); }

        .btn-action {
            background: var(--primary);
            color: #000;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
        }
        .btn-action:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* GRID */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .asset-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .asset-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-color: rgba(255, 204, 0, 0.3);
        }

        .img-box {
            width: 100%;
            aspect-ratio: 1/1; /* FORMAT 1:1 */
            background: #000;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s, opacity 0.3s;
        }

        .img-box:hover img { 
            transform: scale(1.05);
            opacity: 0.8;
        }

        /* Bouton d'édition sur l'image */
        .edit-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            z-index: 10;
        }

        .asset-card:hover .edit-btn { opacity: 1; }
        .edit-btn:hover { background: var(--primary); color: black; }

        .content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .category-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: block;
        }

        .asset-title {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .description {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .file-input { display: none; }

        /* MODAL (POPUP) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-modal:hover { color: var(--primary); }
        .modal-caption {
            position: absolute;
            bottom: 20px;
            color: white;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        #export-md-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--card-bg);
            color: white;
            border: 1px solid var(--border);
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
        #export-md-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px);
        }
    }
    </style>
</head>
<body>

<header>
    <div class="logo-section">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="var(--primary)"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/></svg>
            <h1>Andra Asset Manager</h1>
        </div>
        <div class="doc-info">
            Document mis à jour le : <span class="doc-date" id="doc-date">11/05/2026</span>
        </div>
    </div>
    <div class="controls">
        <input type="text" id="search" placeholder="Rechercher un asset...">
        <select id="filter-film">
            <option value="all">Tous les films</option>
            <option value="CSA">CSA</option>
            <option value="CSM">CSM</option>
            <option value="CIRES">CIRES</option>
            <option value="CMHM">CMHM</option>
        </select>
        <button id="pdf-gen-btn" class="btn-action" onclick="generatePDF()">
            📄 Générer PDF
        </button>
    </div>
</header>

<div class="container">
    <div class="grid" id="asset-grid">
        <!-- Rendered via JS -->
    </div>
</div>

<button id="export-md-btn" onclick="exportMarkdown()">📋 Copier Markdown</button>

<!-- THE MODAL -->
<div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="modalImg">
    <div class="modal-caption" id="modalCaption"></div>
</div>

<script>
    // Variables globales
    let currentLatestDate = new Date('2026-05-20T00:00:00'); // Date par défaut

    const assets = [
        { name: "Fût Métallique Standard", cat: "Colis", film: ["CSA", "CSM"], seq: "SQ5/SQ3", desc: "Empilement dans les ouvrages.", img: "fut_metallique.png" },
        { name: "Fût Béton", cat: "Colis", film: ["CSA", "CSM"], seq: "SQ5/SQ3", desc: "Colis cylindriques massifs.", img: "fut_beton.png" },
        { name: "Monolithe Béton", cat: "Colis", film: ["CSM", "CSA"], seq: "SQ3", desc: "Blocs cubiques scellant les colis.", img: "monolithe_beton.png" },
        { name: "Big Bags TFA", cat: "Colis", film: ["CIRES"], seq: "SQ2", desc: "Sacs souples.", img: "colis_tfa_bigbag.png" },
        { name: "Caissons & Containers", cat: "Colis", film: ["CIRES", "CSM"], seq: "SQ2/SQ3", desc: "Boîtes métalliques rectangulaires.", img: "caissons.png" },
        { name: "Grands Composants TFA", cat: "Colis", film: ["CIRES"], seq: "SQ5", desc: "Pièces volumineuses de démantèlement.", img: "grands_composants.png" },
        { name: "Alvéole", cat: "Infrastructure", film: ["CIRES"], seq: "SQ5", desc: "Alvéoles recouvertes en animation.", img: "alveole.png" },
        { name: "Tunnel / Galerie", cat: "Infrastructure", film: ["CMHM"], seq: "Intro", desc: "Descente vers le laboratoire souterrain.", img: "galeries_souterraines.png" },
        { name: "Ouvrages de stockage", cat: "Infrastructure", film: ["CSA"], seq: "SQ5", desc: "Caissons béton pour fûts.", img: "ouvrages_stockage.png" },
        { name: "Bâtiments Mobiles", cat: "Infrastructure", film: ["CSA"], seq: "SQx", desc: "Hangars coulissants.", img: "charpente_mobile.png" },
        { name: "Tumulus", cat: "Infrastructure", film: ["CSM"], seq: "SQ3", desc: "Structure pyramidale révélée en 3D.", img: "tumulus.png" },
        { name: "Pont roulant & pince", cat: "Machines", film: ["CSA"], seq: "SQ5", desc: "Levage des fûts.", img: "pont_roulant.png" },
        { name: "Palonnier à monolithes", cat: "Machines", film: ["CSA"], seq: "SQ3", desc: "Déplacement des blocs béton.", img: "palonnier.png" },
        { name: "Gravier / Sable", cat: "Matériaux", film: ["TyFlow"], seq: "SQx", desc: "Comblement entre colis.", img: "gravier_sable.png" },
        { name: "Bitume / Béton", cat: "Matériaux", film: ["TyFlow"], seq: "SQx", desc: "Étanchéité et scellement.", img: "bitume_beton.png" },
        { name: "Terre / Argile", cat: "Matériaux", film: ["TyFlow"], seq: "SQx", desc: "Couverture finale et végétalisation.", img: "couverture_vegetalisation.png" },
        { name: "Revêtement polyuréthane Alveole", cat: "Matériaux", film: ["CIRES"], seq: "SQ5", desc: "revêtement tapissant la tranchée dans l'alvéole", img: "Polyurethane_Alveole.png" }
    ];

    const grid = document.getElementById('asset-grid');
    const searchInput = document.getElementById('search');
    const filmFilter = document.getElementById('filter-film');
    const docDateSpan = document.getElementById('doc-date');

    // Mettre à jour l'affichage de la date
    function updateDateDisplay() {
        const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
        docDateSpan.textContent = currentLatestDate.toLocaleDateString('fr-FR', options);
    }

    function renderAssets() {
        const searchTerm = searchInput.value.toLowerCase();
        const selectedFilm = filmFilter.value;

        grid.innerHTML = '';

        assets.filter(a => {
            const matchesSearch = a.name.toLowerCase().includes(searchTerm) || a.desc.toLowerCase().includes(searchTerm);
            const matchesFilm = selectedFilm === 'all' || a.film.includes(selectedFilm);
            return matchesSearch && matchesFilm;
        }).forEach((a, index) => {
            const card = document.createElement('div');
            card.className = 'asset-card';
            card.innerHTML = `
                <div class="img-box" onclick="openModal(${index}, '${a.name}')">
                    <img src="${a.img}" id="img-${index}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%23333\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23888\\' font-family=\\'Arial\\' font-size=\\'10\\' text-anchor=\\'middle\\' dominant-baseline=\\'middle\\'>Image absente</text></svg>'">
                    
                    <!-- Bouton Upload séparé -->
                    <div class="edit-btn" onclick="event.stopPropagation(); triggerUpload(${index})" title="Importer une nouvelle image">
                        ✏️
                    </div>
                    <input type="file" id="file-${index}" class="file-input" accept="image/*" onchange="previewImage(event, ${index})">
                </div>
                <div class="content">
                    <span class="category-tag">${a.cat}</span>
                    <h3 class="asset-title">${a.name}</h3>
                    <p class="description">${a.desc}</p>
                    <div class="tags">
                        ${a.film.map(f => `<span class="tag">${f}</span>`).join('')}
                        <span class="tag">${a.seq}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Modal Logic
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const modalCaption = document.getElementById("modalCaption");

    function openModal(index, captionText) {
        const targetImg = document.getElementById(`img-${index}`);
        
        if(targetImg) {
            modal.classList.add('active');
            modalImg.src = targetImg.src;
            modalCaption.textContent = captionText;
        }
    }

    function closeModal() {
        modal.classList.remove('active');
    }

    // Upload / Import Logic
    function triggerUpload(index) {
        document.getElementById(`file-${index}`).click();
    }

    function previewImage(event, index) {
        const file = event.target.files[0];
        if (file) {
            // Mettre à jour la date globale si le fichier importé est plus récent
            const fileDate = new Date(file.lastModified);
            if (fileDate > currentLatestDate) {
                currentLatestDate = fileDate;
                updateDateDisplay();
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById(`img-${index}`);
                imgElement.src = e.target.result;
                
                // Mettre à jour le tableau assets (en mémoire) pour que la popup utilise la nouvelle image
                const realIndex = assets.findIndex(a => a.name === document.querySelectorAll('.asset-title')[index].textContent);
                if(realIndex !== -1) {
                    assets[realIndex].img = e.target.result; 
                }
            };
            reader.readAsDataURL(file);
        }
    }

    function exportMarkdown() {
        let md = "| Catégorie | Asset | Film / Séquence | Description | Visuel |\n| :--- | :--- | :--- | :--- | :--- |\n";
        assets.forEach(a => {
            // Si c'est une image locale temporaire (base64), on garde le nom original pour le markdown
            let imgSrc = a.img.startsWith('data:') ? 'image_importee.png' : a.img;
            md += `| ${a.cat} | **${a.name}** | ${a.film.join('/')} ${a.seq} | ${a.desc} | ![${a.name}](ASSETS/${imgSrc}) |\n`;
        });
        navigator.clipboard.writeText(md).then(() => {
            alert("Tableau Markdown copié dans le presse-papier !");
        });
    }

    async function generatePDF() {
        const btn = document.getElementById('pdf-gen-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '⏳ Génération...';
        btn.disabled = true;

        try {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const margin = 15;
            const colCount = 3;
            const gap = 10;
            const colWidth = (pageWidth - (margin * 2) - (gap * (colCount - 1))) / colCount;
            
            // Layout carte
            const imgSize = colWidth;
            const textSectionHeight = 45; 
            const cardHeight = imgSize + textSectionHeight;
            
            let currentY = margin;
            let currentX = margin;
            let colIndex = 0;

            // En-tête
            pdf.setFontSize(16);
            pdf.setFont("helvetica", "bold");
            pdf.setTextColor(0, 0, 0);
            pdf.text("ANDRA - 3D Asset Manager", margin, currentY + 5);
            
            pdf.setFontSize(10);
            pdf.setFont("helvetica", "normal");
            pdf.setTextColor(100, 100, 100);
            const dateStr = document.getElementById('doc-date').textContent;
            pdf.text(`Mis à jour le : ${dateStr}`, margin, currentY + 12);
            
            currentY += 25;

            // Récupérer les assets affichés à l'écran
            const displayedTitles = Array.from(document.querySelectorAll('.asset-title')).map(el => el.textContent);
            const filteredAssets = assets.filter(a => displayedTitles.includes(a.name));

            for (let i = 0; i < filteredAssets.length; i++) {
                const asset = filteredAssets[i];
                
                // Sauts de page
                if (currentY + cardHeight > pageHeight - margin) {
                    pdf.addPage();
                    currentY = margin;
                    colIndex = 0;
                    currentX = margin;
                }

                // Fond de carte et bordure
                pdf.setDrawColor(200, 200, 200);
                pdf.setFillColor(255, 255, 255);
                pdf.roundedRect(currentX, currentY, colWidth, cardHeight, 2, 2, 'FD');

                // Image via un canvas intermédiaire pour assurer la compatibilité jsPDF (base64)
                const realIndex = assets.findIndex(a => a.name === asset.name);
                const imgElement = document.getElementById(`img-${realIndex}`);
                if (imgElement && imgElement.src && !imgElement.src.includes('Image absente')) {
                    try {
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = imgElement.naturalWidth || 512;
                        tempCanvas.height = imgElement.naturalHeight || 512;
                        const ctx = tempCanvas.getContext('2d');
                        ctx.drawImage(imgElement, 0, 0, tempCanvas.width, tempCanvas.height);
                        const imgData = tempCanvas.toDataURL('image/jpeg', 0.9);
                        pdf.addImage(imgData, 'JPEG', currentX, currentY, imgSize, imgSize);
                    } catch (e) {
                        pdf.setFillColor(240, 240, 240);
                        pdf.rect(currentX, currentY, imgSize, imgSize, 'F');
                    }
                } else {
                    pdf.setFillColor(240, 240, 240);
                    pdf.rect(currentX, currentY, imgSize, imgSize, 'F');
                }

                // Ligne séparatrice
                pdf.setDrawColor(230, 230, 230);
                pdf.line(currentX, currentY + imgSize, currentX + colWidth, currentY + imgSize);

                let textY = currentY + imgSize + 5;
                
                // Catégorie
                pdf.setFontSize(8);
                pdf.setFont("helvetica", "bold");
                pdf.setTextColor(255, 150, 0);
                pdf.text(asset.cat.toUpperCase(), currentX + 3, textY);
                textY += 5;

                // Titre
                pdf.setFontSize(10);
                pdf.setFont("helvetica", "bold");
                pdf.setTextColor(0, 0, 0);
                const splitTitle = pdf.splitTextToSize(asset.name, colWidth - 6);
                pdf.text(splitTitle, currentX + 3, textY);
                textY += (splitTitle.length * 4) + 2;

                // Description
                pdf.setFontSize(8);
                pdf.setFont("helvetica", "normal");
                pdf.setTextColor(100, 100, 100);
                const splitDesc = pdf.splitTextToSize(asset.desc, colWidth - 6);
                pdf.text(splitDesc, currentX + 3, textY);
                
                // Tags en bas de carte
                pdf.setFontSize(7);
                pdf.setTextColor(150, 150, 150);
                const tagsStr = [...asset.film, asset.seq].join(' • ');
                pdf.text(tagsStr, currentX + 3, currentY + cardHeight - 3);

                // Déplacement
                colIndex++;
                if (colIndex >= colCount) {
                    colIndex = 0;
                    currentX = margin;
                    currentY += cardHeight + gap;
                } else {
                    currentX += colWidth + gap;
                }
            }

            pdf.save('ANDRA_Asset_Manager.pdf');
        } catch (error) {
            console.error("Erreur lors de la génération du PDF", error);
            alert("Erreur lors de la génération du PDF.");
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    searchInput.addEventListener('input', renderAssets);
    filmFilter.addEventListener('change', renderAssets);

    // Initialisation
    updateDateDisplay();
    renderAssets();
</script>

</body>
</html>
